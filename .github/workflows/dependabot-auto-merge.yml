# Merges Dependabot PRs automatically once CI is green — but only for
# minor/patch updates. Major bumps stay open for a human to review.
#
# Runs on `workflow_run` (after the CI workflow finishes) so it has a
# write-capable token; CI itself runs on `pull_request` with read-only access.
name: Dependabot auto-merge

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  merge:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      startsWith(github.event.workflow_run.head_branch, 'dependabot/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const branch = context.payload.workflow_run.head_branch;

            const { data: prs } = await github.rest.pulls.list({ owner, repo, head: `${owner}:${branch}`, state: "open" });
            const pr = prs[0];
            if (!pr) return core.info(`No open PR for ${branch}`);
            if (pr.user.login !== "dependabot[bot]") return core.info("Not a Dependabot PR");

            // Dependabot titles/bodies: "Bump X from 1.2.3 to 1.3.0" / "Updates `x` from 4 to 7"
            const text = `${pr.title}\n${pr.body ?? ""}`;
            const bumps = [...text.matchAll(/from v?(\d+)(?:\.\d+)*(?:[^\d\s][\w.-]*)? to v?(\d+)(?:\.\d+)*/gi)];
            if (bumps.length === 0) return core.info("Could not parse versions — leaving for manual review");

            const major = bumps.filter(([, from, to]) => from !== to);
            if (major.length) {
              core.info(`Major bump detected (${major.map(m => m[0]).join("; ")}) — leaving for manual review`);
              await github.rest.issues.addLabels({ owner, repo, issue_number: pr.number, labels: ["needs-review"] }).catch(() => {});
              return;
            }

            core.info(`Merging #${pr.number}: ${pr.title}`);
            await github.rest.pulls.merge({ owner, repo, pull_number: pr.number, merge_method: "squash" });
