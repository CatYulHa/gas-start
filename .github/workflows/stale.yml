# Nudges, then closes, issues and PRs that have gone quiet.
name: Stale

on:
  schedule:
    - cron: "0 3 * * 1" # Mondays 03:00 UTC
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v11
        with:
          days-before-stale: 60
          days-before-close: 14
          exempt-issue-labels: "good first issue,help wanted,pinned"
          exempt-pr-labels: "pinned"
          stale-issue-label: stale
          stale-pr-label: stale
          stale-issue-message: >
            This issue has had no activity for 60 days. It will be closed in 14 days unless
            someone comments. If it is still relevant, a short "still relevant" is enough.
          stale-pr-message: >
            This PR has had no activity for 60 days. It will be closed in 14 days unless
            it is updated. Feel free to reopen later.
